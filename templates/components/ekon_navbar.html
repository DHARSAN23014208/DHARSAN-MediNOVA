<!-- Accessible Mobile Navigation Drawer (Full-Featured Modal / Card) -->
<div id="mobileNavDrawer" class="mobile-nav-drawer mn-mobile-drawer" role="menu" data-mobile-menu aria-label="Mobile Navigation">
    <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}" role="menuitem">Home</a>
    <a href="/features" class="nav-link {% if active_page == 'features' %}active{% endif %}" role="menuitem">Disease Prediction</a>
    <a href="/features#scanner" class="nav-link" role="menuitem">Lab Report Scanner</a>
    <a href="/contact" class="nav-link {% if active_page == 'contact' %}active{% endif %}" role="menuitem">Find Specialist Hospitals</a>
    <a href="/contact#appointments" class="nav-link" role="menuitem">Appointments</a>
    <a href="/#how-it-works" class="nav-link" role="menuitem">How It Works</a>
    <div style="display: flex; gap: 10px; align-items: center; margin-top: 0.5rem;">
        <button class="mn-theme-toggle theme-toggle-btn" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme" style="flex: 1; border-radius: 999px; height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
            <span data-theme-icon aria-hidden="true"></span>
            <span style="font-size: 0.82rem; font-weight: 600;">Switch Theme</span>
        </button>
        <button type="button" class="mn-button mn-button--small mn-theme-system-btn" data-theme-system hidden style="flex: 1; justify-content: center;">
            Use Device Theme
        </button>
    </div>
    <a href="/features" class="btn-ekon-primary mn-button mn-button--primary" style="justify-content: center; margin-top: 0.5rem;" role="menuitem">
        <span>Start Diagnosis →</span>
    </a>
</div>

<script>
    (function() {
        var toggle = document.getElementById('navToggleBtn');
        var drawer = document.getElementById('mobileNavDrawer');
        if (toggle && drawer) {
            toggle.addEventListener('click', function() {
                var isOpen = drawer.classList.contains('open') || drawer.classList.contains('is-open');
                if (isOpen) {
                    drawer.classList.remove('open');
                    drawer.classList.remove('is-open');
                    toggle.setAttribute('aria-expanded', 'false');
                } else {
                    drawer.classList.add('open');
                    drawer.classList.add('is-open');
                    toggle.setAttribute('aria-expanded', 'true');
                }
            });

            // Close when pressing Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && (drawer.classList.contains('open') || drawer.classList.contains('is-open'))) {
                    drawer.classList.remove('open');
                    drawer.classList.remove('is-open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.focus();
                }
            });

            // Close when clicking outside
            document.addEventListener('click', function(e) {
                if (!drawer.contains(e.target) && !toggle.contains(e.target) && (drawer.classList.contains('open') || drawer.classList.contains('is-open'))) {
                    drawer.classList.remove('open');
                    drawer.classList.remove('is-open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }
    })();
</script>
